
name: Build PhantomTrace APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract source
        run: |
          unzip -q PhantomTrace-Android-Source-with-Cloud-Build.zip -d source

      - name: Compile APK
        run: |
          cd source/PhantomTrace
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhantomTrace-debug-APK
          path: source/PhantomTrace/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
